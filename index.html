<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d2a" />
    <meta name="description" content="Numeric Monopoly Matematic — permainan monopoli matematika premium yang ringan, responsif, dan bisa dipasang di HP." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/logo-favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>Numeric Monopoly Matematic</title>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="global-toast-stack" class="toast-stack" aria-live="polite"></div>

    <audio id="audio-click" preload="auto" src="assets/audio/sfx-click.mp3"></audio>
    <audio id="audio-correct" preload="auto" src="assets/audio/sfx-correct.mp3"></audio>
    <audio id="audio-wrong" preload="auto" src="assets/audio/sfx-wrong.mp3"></audio>
    <audio id="audio-roll" preload="auto" src="assets/audio/sfx-roll.mp3"></audio>
    <audio id="audio-login" preload="auto" loop src="assets/audio/music-login.mp3"></audio>
    <audio id="audio-game" preload="auto" loop src="assets/audio/music-game.mp3"></audio>

    <noscript>
      <div class="noscript-card">Game ini membutuhkan JavaScript agar bisa dimainkan.</div>
    </noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
